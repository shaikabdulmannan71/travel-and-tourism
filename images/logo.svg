<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic 3D Gold Gradient for Main Surfaces -->
    <linearGradient id="goldMetallicMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C4"/>
      <stop offset="20%" stop-color="#F2D16B"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#9A7217"/>
      <stop offset="90%" stop-color="#CFA533"/>
      <stop offset="100%" stop-color="#FFF2B8"/>
    </linearGradient>

    <!-- Linear Gold for Text with Bright Top Shimmer -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="35%" stop-color="#F3D372"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="90%" stop-color="#9B7318"/>
      <stop offset="100%" stop-color="#735207"/>
    </linearGradient>

    <!-- Spherical Radial Gradient for 3D Crown Jewels / Spheres -->
    <radialGradient id="goldSphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF2B5"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#8C6514"/>
      <stop offset="100%" stop-color="#4F3805"/>
    </radialGradient>

    <!-- Linear Gradient for Flight Swoosh -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88A1E"/>
      <stop offset="30%" stop-color="#F3D372"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FFF8D6"/>
    </linearGradient>

    <!-- 3D Realistic Drop Shadow Filter matching physical wall plaque -->
    <filter id="royalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#royalShadow)">
    <!-- ==================== CROWN 5 JEWEL SPHERES ==================== -->
    <circle cx="180" cy="95" r="10" fill="url(#goldSphereGrad)" />
    <circle cx="238" cy="65" r="12" fill="url(#goldSphereGrad)" />
    <circle cx="300" cy="45" r="14.5" fill="url(#goldSphereGrad)" />
    <circle cx="362" cy="65" r="12" fill="url(#goldSphereGrad)" />
    <circle cx="420" cy="95" r="10" fill="url(#goldSphereGrad)" />

    <!-- ==================== CROWN MAIN BODY ==================== -->
    <path d="M 180,105 
             C 194,136 204,152 214,156 
             C 220,136 224,90 238,77 
             C 248,130 260,154 272,157 
             C 278,122 284,72 300,59 
             C 316,72 322,122 328,157 
             C 340,154 352,130 362,77 
             C 376,90 380,136 386,156 
             C 396,152 406,136 420,105 
             C 408,135 398,162 396,172 
             C 345,158 255,158 204,172 
             C 202,162 192,135 180,105 
             Z" 
          fill="url(#goldMetallicMain)" />

    <!-- ==================== CROWN ARCHED BASE BAND ==================== -->
    <path d="M 202,185 
             C 255,170 345,170 398,185 
             L 400,198 
             C 345,183 255,183 200,198 
             Z" 
          fill="url(#goldMetallicMain)" />

    <!-- ==================== FLIGHT SWOOSH ARC ==================== -->
    <path d="M 140,260 
             C 240,205 365,198 455,216 
             C 458,217 458,222 455,223 
             C 360,206 240,213 140,266 
             C 137,264 137,261 140,260 
             Z" 
          fill="url(#swooshGrad)" />

    <!-- ==================== AIRPLANE SILHOUETTE ==================== -->
    <g transform="translate(492, 222) rotate(-20) scale(1.35)">
      <path d="M 0,-20 
               C 2.5,-20 5,-14 5,-5 
               L 30,7 
               L 30,12 
               L 5,9 
               L 5,21 
               L 13,28 
               L 13,32 
               L 1,30 
               L -1,30 
               L -13,32 
               L -13,28 
               L -5,21 
               L -5,9 
               L -30,12 
               L -30,7 
               L -5,-5 
               C -5,-14 -2.5,-20 0,-20 
               Z" 
            fill="url(#goldMetallicMain)" />
    </g>

    <!-- ==================== KING'S WORDMARK ==================== -->
    <text x="300" y="348" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
          font-size="96" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#goldTextGrad)">KING'S</text>

    <!-- ==================== TRAVEL AND TOURISM SUBTITLE ==================== -->
    <text x="300" y="405" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif" 
          font-size="24.5" 
          font-weight="800" 
          letter-spacing="11" 
          fill="url(#goldMetallicMain)">TRAVEL AND TOURISM</text>
  </g>
</svg>
